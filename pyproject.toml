[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "degradation-aware-dispatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["simses==2.1.1", "torch", "numpy", "scipy", "pandas", "tzdata"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]
milp = ["coptpy==8.0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 50
markers = ["teacher: bounded native teacher checks"]
